name: Deploy Quartz site to GitHub Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 你的笔记仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: vault
      - name: 拉取官方Quartz源码
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          fetch-depth: 0
          path: quartz-src
      - name: 复制quartz核心文件到工作目录
        run: |
          cp -r quartz-src/* ./
          cp -r vault/* ./content/
      - name: 安装依赖
        run: npm ci
      - name: 构建Quartz静态网页
        run: npx quartz build
      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到Pages
        id: deployment
        uses: actions/deploy-pages@v4
